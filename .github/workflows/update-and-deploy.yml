name: Singer Customer App - Update & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - catalogue.json
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: singer-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Validate frontend JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          if "<!DOCTYPE HTML>" not in html.upper():
              raise SystemExit("index.html is missing a valid DOCTYPE.")
          if "</html>" not in html.lower():
              raise SystemExit("index.html is incomplete.")
          scripts=re.findall(r"<script(?:[^>]*)>(.*?)</script>", html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No inline application script found.")
          Path("/tmp/singer-app.js").write_text(scripts[-1],encoding="utf-8")
          print("Frontend markup/script extraction passed.")
          PY
          node --check /tmp/singer-app.js
      - name: Validate frontend data contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("catalogue.json").read_text(encoding="utf-8"))
          products=data.get("products", [])
          if not isinstance(products, list) or not products:
              raise SystemExit("catalogue.json does not contain a usable products list.")
          required={"product","sku","price","url"}
          bad=[i for i,x in enumerate(products) if not required.issubset(x.keys())]
          if bad:
              raise SystemExit(f"Catalogue data contract failed for {len(bad)} records.")
          print(f"Data contract passed: {len(products)} products.")
          PY
      - name: Refresh Singer catalogue
        run: python scripts/update_catalogue.py
      - name: Validate catalogue health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("catalogue.json").read_text(encoding="utf-8"))
          products=p.get("products",[])
          if len(products) < 50:
              raise SystemExit(f"Catalogue validation failed: only {len(products)} products.")
          live=sum(1 for x in products if x.get("live"))
          if live/max(1,len(products)) < 0.60:
              raise SystemExit(f"Catalogue validation failed: live coverage {live}/{len(products)}.")
          skus=[str(x.get("sku","")).strip().upper() for x in products if str(x.get("sku","")).strip()]
          duplicate_skus=len(products)-len(set(skus))
          if sum(1 for x in products if not x.get("sku")):
              raise SystemExit("Catalogue validation failed: at least one product has no SKU.")
          if sum(1 for x in products if not x.get("url")):
              raise SystemExit("Catalogue validation failed: at least one product has no source URL.")
          if duplicate_skus:
              raise SystemExit(f"Catalogue validation failed: {duplicate_skus} duplicate SKU records.")
          print(f"Catalogue validation passed: {len(products)} products, {live} live, {p.get('summary',{}).get('stockStatusKnown',0)} with known internal stock.")
          PY
      - name: Commit refreshed catalogue
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalogue.json
          if git diff --cached --quiet; then
            echo "No catalogue changes."
          else
            git commit -m "chore: refresh Singer catalogue"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v5
