name: Singer Customer App - Update & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - catalogue.json
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: singer-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Refresh Singer catalogue
        run: python scripts/update_catalogue.py
      - name: Commit refreshed catalogue
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalogue.json
          if git diff --cached --quiet; then
            echo "No catalogue changes."
            exit 0
          fi
          git commit -m "chore: refresh Singer catalogue"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
